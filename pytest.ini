[pytest]
# Only roomchat/tests.py is a test file; its classes are named *Tests (kept from Django).
testpaths = roomchat
python_files = tests.py
python_classes = *Tests
# Every `async def` test runs on pytest-asyncio, each on its own fresh event loop.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
