# Render Blueprint for RoomChat.
#
# Stands up three services: the ASGI web service, a Postgres database and a Key Value
# (Redis) instance for the realtime layer (roomchat/realtime.py). All three must share a
# region — fromDatabase yields the database's *internal* hostname and fromService yields
# redis://red-xxxx:6379, and neither resolves across regions.

databases:
  - name: roomchat-db
    databaseName: roomchat
    user: roomchat
    plan: free
    region: oregon

services:
  - type: keyvalue
    name: roomchat-redis
    plan: free
    region: oregon
    # Empty list = reachable only from inside Render's network.
    ipAllowList: []

  - type: web
    name: roomchat
    runtime: python
    plan: free
    region: oregon
    # Any non-API path returns the SPA shell as a plain 200, signed in or not.
    healthCheckPath: /login
    # alembic runs here because preDeployCommand requires a paid instance type. On the
    # first deploy it adopts the database Django built (the baseline is skipped when
    # rooms_room exists) and applies 0002. If it ever fails at build time, move it to
    # the front of startCommand instead — safe on a single instance.
    #
    # No npm step: this runtime is python-only. The React bundle in static/react/ is
    # built locally with `yarn build` and committed; the app serves it from static/
    # with ?v=<content hash> URLs, so there is no collectstatic step.
    buildCommand: >-
      pip install -r requirements.txt &&
      alembic upgrade head
    # uvicorn, not gunicorn: WebSockets need ASGI. --workers 1 is explicit so Render's
    # WEB_CONCURRENCY can't change it. --proxy-headers + --forwarded-allow-ips '*' make
    # uvicorn take the client address (X-Forwarded-For) and scheme (X-Forwarded-Proto:
    # https) from Render's proxy; the port is only reachable through Render's network.
    startCommand: uvicorn roomchat.asgi:application --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips '*'
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # ALLOWED_HOSTS is deliberately absent — settings.py derives it from
      # RENDER_EXTERNAL_HOSTNAME, which Render injects automatically.
      - key: DB_NAME
        fromDatabase:
          name: roomchat-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: roomchat-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: roomchat-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: roomchat-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: roomchat-db
          property: port
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: roomchat-redis
          property: connectionString
